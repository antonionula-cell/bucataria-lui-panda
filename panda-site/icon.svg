<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundal verde bambus -->
  <rect width="512" height="512" rx="110" fill="#4E7C3F"/>
  <rect x="10" y="10" width="492" height="492" rx="100" fill="#7FB069"/>

  <!-- Panda din site, centrat si scalat (original viewBox 200x200, scala 2.3x, offset 50,20) -->
  <g transform="translate(50, 15) scale(2.06)">
    <!-- Body -->
    <ellipse cx="100" cy="130" rx="65" ry="60" fill="white" stroke="#1A1A1A" stroke-width="2.5"/>
    <!-- Head -->
    <circle cx="100" cy="80" r="52" fill="white" stroke="#1A1A1A" stroke-width="2.5"/>
    <!-- Ears -->
    <circle cx="62" cy="36" r="18" fill="#1A1A1A"/>
    <circle cx="138" cy="36" r="18" fill="#1A1A1A"/>
    <circle cx="62" cy="36" r="10" fill="#3A3A3A"/>
    <circle cx="138" cy="36" r="10" fill="#3A3A3A"/>
    <!-- Eye patches -->
    <ellipse cx="80" cy="72" rx="16" ry="14" fill="#1A1A1A"/>
    <ellipse cx="120" cy="72" rx="16" ry="14" fill="#1A1A1A"/>
    <!-- Eyes -->
    <circle cx="80" cy="72" r="7" fill="white"/>
    <circle cx="120" cy="72" r="7" fill="white"/>
    <circle cx="82" cy="70" r="3" fill="#1A1A1A"/>
    <circle cx="122" cy="70" r="3" fill="#1A1A1A"/>
    <circle cx="84" cy="68" r="1.5" fill="white"/>
    <circle cx="124" cy="68" r="1.5" fill="white"/>
    <!-- Nose -->
    <ellipse cx="100" cy="88" rx="8" ry="6" fill="#1A1A1A"/>
    <!-- Smile -->
    <path d="M88 98 Q100 110 112 98" stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="68" cy="92" r="8" fill="#FFB3B3" opacity="0.5"/>
    <circle cx="132" cy="92" r="8" fill="#FFB3B3" opacity="0.5"/>
    <!-- Belly -->
    <ellipse cx="100" cy="138" rx="30" ry="28" fill="#E8E8E8"/>
    <!-- Arms -->
    <ellipse cx="48" cy="130" rx="18" ry="12" fill="#1A1A1A" transform="rotate(-20 48 130)"/>
    <ellipse cx="152" cy="130" rx="18" ry="12" fill="#1A1A1A" transform="rotate(20 152 130)"/>
    <!-- Bambus in mana dreapta -->
    <rect x="155" y="110" width="8" height="50" rx="4" fill="#7FB069" transform="rotate(15 155 110)"/>
    <rect x="155" y="122" width="8" height="4" rx="2" fill="#4E7C3F" transform="rotate(15 155 110)"/>
    <rect x="155" y="138" width="8" height="4" rx="2" fill="#4E7C3F" transform="rotate(15 155 110)"/>
    <!-- Legs -->
    <ellipse cx="78" cy="184" rx="22" ry="15" fill="#1A1A1A"/>
    <ellipse cx="122" cy="184" rx="22" ry="15" fill="#1A1A1A"/>
    <ellipse cx="78" cy="186" rx="14" ry="9" fill="#2B2B2B"/>
    <ellipse cx="122" cy="186" rx="14" ry="9" fill="#2B2B2B"/>
  </g>
</svg>
