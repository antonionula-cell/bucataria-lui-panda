<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="#4E7C3F"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="#7FB069"/>

  <!-- Panda centrat, scaled up -->
  <g transform="translate(56, 50) scale(2.0)">
    <!-- Body -->
    <ellipse cx="100" cy="130" rx="65" ry="60" fill="white" stroke="#1A1A1A" stroke-width="2.5"/>
    <!-- Head -->
    <circle cx="100" cy="80" r="52" fill="white" stroke="#1A1A1A" stroke-width="2.5"/>
    <!-- Ears -->
    <circle cx="62" cy="36" r="18" fill="#1A1A1A"/>
    <circle cx="138" cy="36" r="18" fill="#1A1A1A"/>
    <circle cx="62" cy="36" r="10" fill="#3A3A3A"/>
    <circle cx="138" cy="36" r="10" fill="#3A3A3A"/>
    <!-- Eye patches -->
    <ellipse cx="80" cy="72" rx="16" ry="14" fill="#1A1A1A"/>
    <ellipse cx="120" cy="72" rx="16" ry="14" fill="#1A1A1A"/>
    <!-- Eyes -->
    <circle cx="80" cy="72" r="7" fill="white"/>
    <circle cx="120" cy="72" r="7" fill="white"/>
    <circle cx="82" cy="70" r="3" fill="#1A1A1A"/>
    <circle cx="122" cy="70" r="3" fill="#1A1A1A"/>
    <circle cx="84" cy="68" r="1.5" fill="white"/>
    <circle cx="124" cy="68" r="1.5" fill="white"/>
    <!-- Nose -->
    <ellipse cx="100" cy="88" rx="8" ry="6" fill="#1A1A1A"/>
    <!-- Hungry mouth — gura deschisa! -->
    <path d="M83 98 Q100 118 117 98" stroke="#1A1A1A" stroke-width="2.5" fill="#1A1A1A" stroke-linecap="round"/>
    <ellipse cx="100" cy="107" rx="13" ry="8" fill="#E05C5C"/>
    <ellipse cx="100" cy="112" rx="8" ry="4" fill="#C0392B"/>
    <!-- Cheeks -->
    <circle cx="68" cy="90" r="9" fill="#FFB3B3" opacity="0.55"/>
    <circle cx="132" cy="90" r="9" fill="#FFB3B3" opacity="0.55"/>
    <!-- Belly -->
    <ellipse cx="100" cy="138" rx="30" ry="28" fill="#E8E8E8"/>
    <!-- Arms -->
    <ellipse cx="48" cy="128" rx="18" ry="12" fill="#1A1A1A" transform="rotate(-20 48 128)"/>
    <ellipse cx="152" cy="128" rx="18" ry="12" fill="#1A1A1A" transform="rotate(20 152 128)"/>
    <!-- Bambus in mana dreapta -->
    <rect x="155" y="108" width="8" height="52" rx="4" fill="#EDF5E7" transform="rotate(15 155 108)"/>
    <rect x="155" y="120" width="8" height="4" rx="2" fill="#4E7C3F" transform="rotate(15 155 108)"/>
    <rect x="155" y="136" width="8" height="4" rx="2" fill="#4E7C3F" transform="rotate(15 155 108)"/>
    <!-- Legs -->
    <ellipse cx="78" cy="182" rx="22" ry="14" fill="#1A1A1A"/>
    <ellipse cx="122" cy="182" rx="22" ry="14" fill="#1A1A1A"/>
    <ellipse cx="78" cy="183" rx="14" ry="8" fill="#2B2B2B"/>
    <ellipse cx="122" cy="183" rx="14" ry="8" fill="#2B2B2B"/>
  </g>
</svg>
